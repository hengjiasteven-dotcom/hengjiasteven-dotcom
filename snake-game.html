<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Snake</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #151a2e;
      --grid: rgba(255,255,255,.05);
      --text: #dce7ff;
      --muted: #8e9cc7;
      --accent: #6ee7a6;
      --accent2: #3fbf67;
      --food: #ff6f8b;
      --danger: #ffb86b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #1b2340 0%, transparent 45%),
        linear-gradient(180deg, #0b0e18, #101427 60%, #0a0d16);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .app {
      width: min(94vw, 760px);
      background: rgba(21,26,46,.88);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pill {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
    }
    .stage {
      display: grid;
      grid-template-columns: 1fr 176px;
      gap: 16px;
      align-items: start;
    }
    .boardWrap {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #111629;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      overflow: hidden;
      min-height: 320px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
      background: linear-gradient(180deg, rgba(9,12,22,.10), rgba(9,12,22,.66));
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .overlay.show { opacity: 1; }
    .overlay strong {
      display: block;
      font-size: 26px;
      margin-bottom: 8px;
    }
    .overlay span {
      color: var(--muted);
      font-size: 14px;
    }
    .side {
      display: grid;
      gap: 12px;
    }
    .panel {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 14px;
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #eef3ff;
    }
    .panel p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button {
      appearance: none;
      border: 0;
      background: #20274a;
      color: var(--text);
      border-radius: 12px;
      padding: 12px 10px;
      font: inherit;
      cursor: pointer;
      transition: transform .08s ease, background .15s ease;
      border: 1px solid rgba(255,255,255,.08);
    }
    button:hover { background: #2a3362; }
    button:active { transform: translateY(1px); }
    .wide { grid-column: span 3; }
    .primary { background: #274d39; }
    .primary:hover { background: #336650; }
    .danger { background: #4a2630; }
    .danger:hover { background: #63303f; }
    .touch {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
      user-select: none;
      touch-action: manipulation;
    }
    .touch button { padding: 14px 8px; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 760px) {
      .stage { grid-template-columns: 1fr; }
      .boardWrap { min-height: 280px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div>
        <h1>Pixel Snake</h1>
      </div>
      <div class="stats">
        <div class="pill">Score: <span id="score">0</span></div>
        <div class="pill">Best: <span id="best">0</span></div>
        <div class="pill">Speed: <span id="speed">1.0x</span></div>
      </div>
    </div>

    <section class="stage">
      <div class="boardWrap">
        <canvas id="game" width="640" height="640"></canvas>
        <div id="overlay" class="overlay show">
          <div>
            <strong>Ready?</strong>
            <span>Press Space to start, arrow keys or WASD to move.</span>
          </div>
        </div>
      </div>

      <aside class="side">
        <div class="panel">
          <h2>Rules</h2>
          <p>Eat food. Don’t hit walls or yourself.</p>
        </div>
        <div class="panel">
          <h2>Controls</h2>
          <p>Arrow keys or WASD<br/>Space: pause / resume<br/>R: restart</p>
        </div>
        <div class="panel">
          <h2>Buttons</h2>
          <div class="controls">
            <button class="primary wide" id="startBtn">Start / Pause</button>
            <button id="restartBtn">Restart</button>
            <button class="danger" id="slowBtn">Slow</button>
            <button class="danger" id="normalBtn">Normal</button>
            <button class="danger" id="fastBtn">Fast</button>
          </div>
          <div class="touch" aria-label="touch controls">
            <div></div>
            <button id="upBtn">↑</button>
            <div></div>
            <button id="leftBtn">←</button>
            <button id="downBtn">↓</button>
            <button id="rightBtn">→</button>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const speedEl = document.getElementById('speed');
    const overlay = document.getElementById('overlay');

    const GRID = 20;
    const SIZE = canvas.width / GRID;
    const STORAGE_KEY = 'pixel-snake-best';

    let snake, dir, nextDir, food, score, best, running, gameOver, tickMs, acc, last;

    best = Number(localStorage.getItem(STORAGE_KEY) || 0);
    bestEl.textContent = best;

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      running = false;
      gameOver = false;
      tickMs = 140;
      acc = 0;
      last = 0;
      placeFood();
      syncHud();
      overlay.classList.add('show');
      overlay.innerHTML = '<div><strong>Ready?</strong><span>Press Space to start, arrow keys or WASD to move.</span></div>';
      draw();
    }

    function syncHud() {
      scoreEl.textContent = score;
      bestEl.textContent = best;
      speedEl.textContent = (140 / tickMs).toFixed(1) + 'x';
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID),
        };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function setDirection(x, y) {
      if (dir.x === -x && dir.y === -y) return;
      nextDir = { x, y };
      if (!running && !gameOver) start();
    }

    function start() {
      if (gameOver) return;
      running = true;
      overlay.classList.remove('show');
    }

    function toggleRun() {
      if (gameOver) return;
      running = !running;
      overlay.classList.toggle('show', !running);
      overlay.innerHTML = running
        ? ''
        : '<div><strong>Paused</strong><span>Press Space to continue.</span></div>';
    }

    function restart() {
      reset();
      start();
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
          snake.some((s, i) => i > 0 && s.x === head.x && s.y === head.y)) {
        gameOver = true;
        running = false;
        overlay.classList.add('show');
        overlay.innerHTML = '<div><strong>Game Over</strong><span>Press R or Restart to play again.</span></div>';
        if (score > best) {
          best = score;
          localStorage.setItem(STORAGE_KEY, best);
        }
        syncHud();
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 1;
        placeFood();
        tickMs = Math.max(70, 140 - score * 4);
        if (score > best) {
          best = score;
          localStorage.setItem(STORAGE_KEY, best);
        }
        syncHud();
      } else {
        snake.pop();
      }
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * SIZE + 2, y * SIZE + 2, SIZE - 4, SIZE - 4);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#111629';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * SIZE); ctx.lineTo(canvas.width, i * SIZE); ctx.stroke();
      }

      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 220);
      ctx.fillStyle = `rgba(255,111,139,${0.75 + pulse * 0.2})`;
      drawCell(food.x, food.y, `rgba(255,111,139,${0.75 + pulse * 0.2})`);

      snake.forEach((seg, i) => {
        const color = i === 0 ? '#7ef0b0' : (i % 2 ? '#55cb7d' : '#3fbf67');
        drawCell(seg.x, seg.y, color);
      });

      if (!gameOver) {
        requestAnimationFrame(draw);
      }
    }

    function loop(ts) {
      if (!last) last = ts;
      const delta = ts - last;
      last = ts;
      if (running) {
        acc += delta;
        while (acc >= tickMs) {
          step();
          acc -= tickMs;
          if (gameOver) break;
        }
      }
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') setDirection(0, -1);
      else if (k === 'arrowdown' || k === 's') setDirection(0, 1);
      else if (k === 'arrowleft' || k === 'a') setDirection(-1, 0);
      else if (k === 'arrowright' || k === 'd') setDirection(1, 0);
      else if (k === ' ') toggleRun();
      else if (k === 'r') restart();
    });

    document.getElementById('startBtn').onclick = () => {
      if (gameOver) restart();
      else toggleRun();
    };
    document.getElementById('restartBtn').onclick = restart;
    document.getElementById('slowBtn').onclick = () => { tickMs = 170; syncHud(); };
    document.getElementById('normalBtn').onclick = () => { tickMs = Math.max(90, 140 - score * 4); syncHud(); };
    document.getElementById('fastBtn').onclick = () => { tickMs = 80; syncHud(); };
    document.getElementById('upBtn').onclick = () => setDirection(0, -1);
    document.getElementById('downBtn').onclick = () => setDirection(0, 1);
    document.getElementById('leftBtn').onclick = () => setDirection(-1, 0);
    document.getElementById('rightBtn').onclick = () => setDirection(1, 0);

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
