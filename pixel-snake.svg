<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Pixel snake">
  <defs>
    <style>
      .bg { fill: #0f1220; }
      .grid { stroke: rgba(255,255,255,0.06); stroke-width: 1; }
      .title { fill: #dce7ff; font: 700 20px monospace; }
      .sub { fill: #90a4d4; font: 14px monospace; }
      .food { fill: #ff6b81; }
      .snake { fill: #62d26f; }
      .snake2 { fill: #3bb44a; }
      .eye { fill: #0f1220; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="260" rx="20"/>

  <text class="title" x="40" y="42">Pixel Snake</text>
  <text class="sub" x="40" y="66">a tiny README decoration</text>

  <g transform="translate(40 90)">
    <rect x="0" y="0" width="640" height="128" rx="12" fill="#13182a"/>
    <g opacity="0.65">
      <path class="grid" d="M16 0V128M32 0V128M48 0V128M64 0V128M80 0V128M96 0V128M112 0V128M128 0V128M144 0V128M160 0V128M176 0V128M192 0V128M208 0V128M224 0V128M240 0V128M256 0V128M272 0V128M288 0V128M304 0V128M320 0V128M336 0V128M352 0V128M368 0V128M384 0V128M400 0V128M416 0V128M432 0V128M448 0V128M464 0V128M480 0V128M496 0V128M512 0V128M528 0V128M544 0V128M560 0V128M576 0V128M592 0V128M608 0V128M624 0V128"/>
      <path class="grid" d="M0 16H640M0 32H640M0 48H640M0 64H640M0 80H640M0 96H640M0 112H640"/>
    </g>

    <rect class="food" x="544" y="32" width="16" height="16" rx="3">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <g>
      <animateTransform attributeName="transform" type="translate"
        values="96 48; 160 48; 224 48; 288 48; 352 48; 416 48; 480 48; 480 80; 416 80; 352 80; 288 80; 224 80; 160 80; 96 80; 96 48"
        dur="8s" repeatCount="indefinite"/>

      <rect class="snake2" x="0" y="0" width="16" height="16" rx="3"/>
      <rect class="snake" x="-16" y="0" width="16" height="16" rx="3"/>
      <rect class="snake" x="-32" y="0" width="16" height="16" rx="3"/>
      <rect class="snake" x="-48" y="0" width="16" height="16" rx="3"/>
      <rect class="snake" x="-64" y="0" width="16" height="16" rx="3"/>
      <rect class="snake" x="-80" y="0" width="16" height="16" rx="3"/>
      <rect class="snake" x="-96" y="0" width="16" height="16" rx="3"/>
      <rect class="snake" x="-112" y="0" width="16" height="16" rx="3"/>

      <rect class="eye" x="4" y="5" width="3" height="3" rx="1"/>
      <rect class="eye" x="10" y="5" width="3" height="3" rx="1"/>
    </g>
  </g>

  <g transform="translate(705 112)">
    <rect x="0" y="0" width="150" height="78" rx="12" fill="#13182a"/>
    <text class="sub" x="16" y="26">status</text>
    <text class="title" x="16" y="54" font-size="18">one step at a time</text>
  </g>
</svg>
